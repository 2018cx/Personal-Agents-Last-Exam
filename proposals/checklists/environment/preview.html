<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment proposal checklist · preview</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --hair:rgba(11,11,11,.10); --grid:#e1e0d9; --code:#f0efec;
  --accent:#2a78d6; --accent-weak:#cde2fb; --accent-ink:#1c5cab; --accent-wash:#eef5fd;
  --critical:#d03b3b; --good:#006300;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --hair:rgba(255,255,255,.10); --grid:#2c2c2a; --code:#262624;
    --accent:#3987e5; --accent-weak:#104281; --accent-ink:#86b6ef; --accent-wash:#16253a;
    --critical:#d03b3b; --good:#0ca30c;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
code{font:.86em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
strong{font-weight:650}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--hair)}
.bar-in{max-width:960px;margin:0 auto;padding:10px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:14px;color:var(--ink2);font-weight:600}
.toggles{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:3px;background:var(--page)}
.seg button{all:unset;cursor:pointer;padding:6px 15px;border-radius:999px;font-size:14px;color:var(--ink2);font-weight:550}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible,.btn:focus-visible,.acc-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:960px;margin:0 auto;padding:32px 24px 64px}
h1{font-size:30px;line-height:1.25;margin:0 0 6px;font-weight:650}
.sub{font-size:17px;color:var(--ink2);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:20px 24px;margin:0 0 16px}

/* hero */
.hero-row{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap}
.hero-main{flex:1 1 320px}
.hero-num{font-size:56px;line-height:1;font-weight:650}
.of{color:var(--muted);font-weight:500}
.hero-label{font-size:15px;color:var(--ink2);margin-top:8px}
.meter{height:10px;border-radius:999px;background:var(--accent-weak);margin-top:14px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.side-num{font-size:30px;line-height:1;font-weight:600}
.ready{display:none;margin-top:12px;color:var(--good);font-weight:650}
.ready.on{display:block}
.hint{font-size:14px;color:var(--muted);margin:14px 0 0}

/* buttons */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.btn{all:unset;cursor:pointer;font-size:14px;padding:7px 15px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}

/* sections */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:20px;margin:0;font-weight:650}
.sec-meta{font-size:14px;color:var(--muted)}
.sec-note{font-size:15px;color:var(--ink2);margin:4px 0 0}
.chip{display:inline-block;font-size:12.5px;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--ink2);font-weight:550;white-space:nowrap;vertical-align:middle}
h2 .chip{margin-left:8px;position:relative;top:-2px}
.tag{display:inline-block;font-size:12.5px;line-height:1;font-weight:650;padding:5px 9px;border-radius:999px;white-space:nowrap}
.tag.blocker{background:var(--critical);color:#fff}
.tag.should{border:1px solid var(--hair);color:var(--ink2);padding:4px 9px}

/* human items */
.items{list-style:none;margin:10px 0 0;padding:0}
.item{display:grid;grid-template-columns:24px 50px 1fr auto;column-gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--grid)}
.item:first-child{border-top:none}
.item input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.iid{font:13px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);cursor:pointer}
.itext{font-size:16px;cursor:pointer}
.item .tag{margin-top:2px}
.item.done .itext{color:var(--muted)}
details.later>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
details.later>summary::-webkit-details-marker{display:none}
details.later>summary h2::before{content:"›";display:inline-block;margin-right:10px;color:var(--muted);transition:transform .15s}
details.later[open]>summary h2::before{transform:rotate(90deg)}

/* agent */
.flow{display:flex;align-items:flex-start;margin:14px 0 6px;flex-wrap:wrap;row-gap:12px}
.step{flex:1 1 0;min-width:120px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 4px}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:650;font-size:15px}
.step .l{font-size:15px;font-weight:600;line-height:1.35}
.arrow{color:var(--muted);font-size:20px;line-height:32px;padding:0 2px}
h3{font-size:16px;margin:18px 0 6px;font-weight:650}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
ol.steps,ul.rules{margin:0;padding-left:22px;font-size:15px;color:var(--ink2)}
ol.steps li,ul.rules li{margin:4px 0}
.tbl{overflow-x:auto}
table.out{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.out th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--grid);padding:6px 8px}
table.out td{border-bottom:1px solid var(--grid);padding:8px;vertical-align:top}
table.out td:first-child{white-space:nowrap}
.v{font-weight:650;white-space:nowrap}
.v.fail{color:var(--critical)} .v.pass{color:var(--good)} .v.na{color:var(--muted)}
.acc{border-top:1px solid var(--grid)}
.acc:first-of-type{border-top:none}
.accs{margin-top:8px}
.acc-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:50px 1fr auto 14px;column-gap:10px;align-items:center;padding:12px 0}
.acc-h .t{font-size:16px;font-weight:600}
.acc-h .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.caret{color:var(--muted);font-size:18px;transition:transform .15s;text-align:center}
.acc.open .caret{transform:rotate(90deg)}
.acc-b{display:none;padding:0 0 16px 60px}
.acc.open .acc-b{display:block}
.human-line{background:var(--accent-wash);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:15px}
.human-line b{color:var(--accent-ink);font-weight:650;margin-right:6px}
dl.f{display:grid;grid-template-columns:118px 1fr;gap:7px 14px;margin:0;font-size:15.5px}
dl.f dt{color:var(--muted);font-size:13.5px;padding-top:2px}
dl.f dd{margin:0}
dl.f dd.src{color:var(--ink2);font-size:14px}

/* human key checks */
.why{margin:6px 0 0;font-size:14px;color:var(--muted)}
h2.layer{font-size:15px;color:var(--ink2);margin:28px 0 10px;font-weight:650}
.keys{list-style:none;margin:0;padding:0}
.key{padding:18px 0;border-top:1px solid var(--grid)}
.key:first-child{border-top:none;padding-top:4px}
.key-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.key-q{font-size:18px;font-weight:650;line-height:1.4}
.kprog{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cps{list-style:none;margin:10px 0 0;padding:0}
.cp{display:grid;grid-template-columns:24px 1fr;column-gap:10px;padding:7px 0}
.cp input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.cp label{font-size:16px;cursor:pointer}
.cid{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-right:8px}
.refs code{font-size:11.5px;color:var(--muted)}
.cp.done label{color:var(--muted)}
.kid{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-right:10px;font-weight:500}
.key.done .key-q{color:var(--muted)}
.key.gate{background:var(--accent-wash);border-radius:10px;padding:14px;margin-bottom:8px}
.key.gate+.key{border-top:none}
.gate-chip{margin-left:10px;border-color:var(--accent);color:var(--accent-ink)}
.mini-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.mini-flow .mf{padding:6px 12px;border-radius:999px;background:var(--page);border:1px solid var(--hair);color:var(--ink2);font-weight:550}
.mini-flow .mf.you{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}
.mini-flow .ar{color:var(--muted)}
.hchip{border-color:var(--accent);color:var(--accent-ink)}
ul.reviewer{margin:0;padding-left:0;list-style:none;font-size:15px}
ul.reviewer li{margin:6px 0;color:var(--ink2)}
ul.reviewer strong{color:var(--ink)}


pre.md{background:var(--code);border-radius:10px;padding:16px;max-height:520px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:0 0 16px;color:var(--ink)}
footer{font-size:13px;color:var(--muted);margin-top:24px}

@media (max-width:760px){ .cols{grid-template-columns:1fr} }
@media (max-width:560px){
  .bar-in{padding:10px 16px}
  main{padding:24px 16px 48px}
  h1{font-size:25px}
  .card{padding:16px}
  .hero-num{font-size:48px}
  .item{grid-template-columns:22px auto 1fr;grid-template-areas:"cb id tag" "cb tx tx";row-gap:2px}
  .item input{grid-area:cb} .item .iid{grid-area:id} .item .tag{grid-area:tag;justify-self:start} .item .itext{grid-area:tx}
  .flow{flex-direction:column;align-items:stretch}
  .step{flex-direction:row;text-align:left;min-width:0}
  .arrow{display:none}
  .acc-h{grid-template-columns:auto 1fr 14px;grid-template-areas:"id tags caret" "t t t";row-gap:4px}
  .acc-h .iid{grid-area:id} .acc-h .tags{grid-area:tags;justify-content:flex-start} .acc-h .caret{grid-area:caret} .acc-h .t{grid-area:t}
  .acc-b{padding-left:0}
  dl.f{grid-template-columns:1fr;gap:2px}
  dl.f dd{margin-bottom:8px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand" id="brand"></div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Version">
        <button type="button" data-view="human"></button><button type="button" data-view="agent"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">简中</button>
      </div>
    </div>
  </div>
</header>
<main id="app"></main>

    "checks": [
      {
        "id": "H3.1",
        "refs": [
          "E3.5",
          "E3.7"
        ],
        "en": "A task author could set up a starting situation for a specific person and reset it afterwards.",
        "zh": "task 作者能为某个特定的人摆好开局情境，结束后也能 reset。"
      },
      {
        "id": "H3.2",
        "refs": [
          "E3.3",
          "E3.6"
        ],
        "en": "The actions and events cover what tasks on these workflows will need; nothing essential is missing.",
        "zh": "动作和事件涵盖这些 workflow 上的 task 会用到的东西，没有缺少关键的部分。"
      }
    ]
  },
  {
    "id": "H4",
    "en": {
      "t": "Could you accept the finished work against this plan?",
      "w": "“The construction plan defines the scope, deliverables, quality checks and effort that reviewers will follow through implementation and merge in this same PR.”"
    },
    "zh": {
      "t": "能按这份计划验收最终成果吗？",
      "w": "“The construction plan defines the scope, deliverables, quality checks and effort that reviewers will follow through implementation and merge in this same PR.”"
    },
    "checks": [
      {
        "id": "H4.1",
        "refs": [
          "E4.1",
          "E4.3",
          "E4.4"
        ],
        "en": "The total effort looks realistic for the scope, the people named and the calendar time.",
        "zh": "以范围、列出的人手和日历时间来看，总工作量合理。"
      },
      {
        "id": "H4.2",
        "refs": [
          "E4.2",
          "E4.7"
        ],
        "en": "The planned checks are strong enough that you could accept the work against them at merge.",
        "zh": "计划中的检查够扎实，合并时可以拿来验收。"
      },
      {
        "id": "H4.3",
        "refs": [
          "E4.5"
        ],
        "en": "The scope boundary leaves out the right things for a first version.",
        "zh": "范围边界对第一版的取舍是对的。"
      }
    ]
  },
  {
    "id": "H5",
    "en": {
      "t": "Are the data, assets and run-time dependencies safe to use?",
      "w": "§4 License and external dependencies: the license for code and assets, what is hosted instead of redistributed, and how run-time services are replayed or controlled."
    },
    "zh": {
      "t": "数据、素材和运行时依赖可以安全使用吗？",
      "w": "§4 License and external dependencies：代码和素材的许可、哪些托管而不再分发、运行时服务如何回放或受控。"
    },
    "checks": [
      {
        "id": "H5.1",
        "refs": [
          "E1.2",
          "E4.6",
          "E4.8"
        ],
        "en": "Nothing in the data or assets looks risky to publish: sources, brand use and licenses all hold up.",
        "zh": "数据和素材里没有发布风险：来源、品牌使用和许可都站得住。"
      },
      {
        "id": "H5.2",
        "refs": [
          "E4.6"
        ],
        "en": "The replay or stand-in plan for any outside service is believable, so runs will not depend on the live internet.",
        "zh": "外部服务的回放或替身方案可信，运行不会依赖真实网络。"
      }
    ]
  }
];

/* ---------- state ---------- */
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const st = { view: "human", lang: "en", open: null, all: false, blockersOnly: false, md: false, checks: {} };
try { st.checks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { st.checks = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st.checks)); } catch (e) {} }

function readHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split("-");
  if (parts[0] === "human" || parts[0] === "agent") st.view = parts[0];
  if (parts[1] === "en" || parts[1] === "zh") st.lang = parts[1];
  st.all = parts.includes("open");
  st.md = parts.includes("md");
}
function writeHash() { history.replaceState(null, "", "#" + st.view + "-" + st.lang); }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function fmt(s) {
  return String(s).split(/(`[^`]+`)/g).map(p =>
    (p.length > 1 && p[0] === "`" && p[p.length - 1] === "`")
      ? "<code>" + esc(p.slice(1, -1)) + "</code>"
      : esc(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  ).join("");
}
const U = () => UI[st.lang];
const X = (it, k) => it[st.lang][k];
const appliesOf = it => it[st.lang].a || SEC[it.sec][st.lang].applies || U().always;
const tag = it => `<span class="tag ${it.sev}">${it.sev === "blocker" ? U().blocker : U().should}</span>`;
const inSec = id => ITEMS.filter(i => i.sec === id);
const layerOf = s => (s.id === "E5" || s.id === "E6") ? "process" : "proposal";
const feeds = it => KEYS.filter(k => k.checks.some(c => c.refs.includes(it.id))).map(k => `<span class="chip hchip">→ ${k.id}</span>`).join("");

/* ---------- human view ---------- */
const MAIN_KEYS = KEYS;
function cpRow(c) {
  const on = !!st.checks[c.id];
  return `<li class="cp${on ? " done" : ""}" id="row-${c.id}">
    <input type="checkbox" id="cb-${c.id}" data-id="${c.id}"${on ? " checked" : ""}>
    <label for="cb-${c.id}"><span class="cid">${c.id}</span>${fmt(c[st.lang])}${c.refs.length ? ` <span class="refs">${c.refs.map(r => `<code>${r}</code>`).join(" ")}</span>` : ""}</label></li>`;
}
function keyCard(k) {
  const u = U(), L = k[st.lang];
  const done = k.checks.filter(c => st.checks[c.id]).length;
  return `<li class="key${k.gate ? " gate" : ""}${done === k.checks.length ? " done" : ""}" id="row-${k.id}">
    <div class="key-head"><span class="key-q"><span class="kid">${k.id}</span>${fmt(L.t)}${k.gate ? `<span class="chip gate-chip">${u.gate}</span>` : ""}</span><span class="kprog" id="kp-${k.id}">${done} / ${k.checks.length}</span></div>
    ${L.w ? `<p class="why">${u.whyLabel} ${fmt(L.w)}</p>` : ""}
    <ul class="cps">${k.checks.map(cpRow).join("")}</ul></li>`;
}
function secMeta(list) {
  return U().meta(list.length, list.filter(i => i.sev === "blocker").length);
}
function humanTotals() {
  const all = MAIN_KEYS.flatMap(k => k.checks);
  return { done: all.filter(c => st.checks[c.id]).length, total: all.length };
}
function renderHuman() {
  const u = U(), { done, total } = humanTotals();
  let h = `<h1>${u.titleH}</h1><p class="sub">${u.subH}</p>
  <section class="card">
    <div class="hero-num"><span id="bNum">${done}</span><span class="of"> / ${total}</span></div>
    <div class="hero-label">${u.heroLabel}</div>
    <div class="meter" role="progressbar" aria-label="${esc(u.heroLabel)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" id="meter"><span id="bBar" style="width:${Math.round(100 * done / total)}%"></span></div>
    <div class="ready${done === total ? " on" : ""}" id="ready">${u.ready}</div>
    <div class="mini-flow">${u.flow.map((f, i) => `${i ? '<span class="ar" aria-hidden="true">→</span>' : ""}<span class="mf${i === u.flow.length - 1 ? " you" : ""}">${esc(f)}</span>`).join("")}</div>
    <p class="hint">${fmt(u.heroHint)}</p>
  </section>
  <div class="actions">
    <button type="button" class="btn" data-act="md" aria-pressed="${st.md}">${st.md ? u.hideMd : u.showMd}</button>
    <button type="button" class="btn" data-act="clear">${u.clear}</button>
  </div>`;
  if (st.md) h += `<pre class="md">${esc(mdHuman())}</pre>`;
  h += `<section class="card"><ul class="keys">${MAIN_KEYS.map(keyCard).join("")}</ul></section>
  <footer>${esc(u.footer)}</footer>`;
  return h;
}
function updateCounts() {
  const { done, total } = humanTotals();
  const n = document.getElementById("bNum"); if (n) n.textContent = done;
  const bar = document.getElementById("bBar"); if (bar) bar.style.width = Math.round(100 * done / total) + "%";
  const m = document.getElementById("meter"); if (m) m.setAttribute("aria-valuenow", done);
  const r = document.getElementById("ready"); if (r) r.classList.toggle("on", done === total);
  for (const k of KEYS) {
    const d = k.checks.filter(c => st.checks[c.id]).length;
    const el = document.getElementById("kp-" + k.id); if (el) el.textContent = `${d} / ${k.checks.length}`;
    const row = document.getElementById("row-" + k.id); if (row) row.classList.toggle("done", d === k.checks.length);
  }
}

/* ---------- agent view ---------- */
function accItem(it) {
  const u = U(), open = st.all || st.open === it.id;
  return `<div class="acc${open ? " open" : ""}" id="acc-${it.id}">
    <button type="button" class="acc-h" data-acc="${it.id}" aria-expanded="${open}">
      <span class="iid">${it.id}</span>
      <span class="t">${fmt(X(it, "t"))}</span>
      <span class="tags">${feeds(it)}${tag(it)}<span class="chip">${it.ref}</span></span>
      <span class="caret">›</span>
    </button>
    <div class="acc-b">
      <p class="human-line"><b>${u.humanLine}</b>${fmt(X(it, "h"))}</p>
      <dl class="f">
        <dt>${u.applies}</dt><dd>${fmt(appliesOf(it))}</dd>
        <dt>${u.look}</dt><dd>${fmt(X(it, "l"))}</dd>
        <dt>${u.pass}</dt><dd>${fmt(X(it, "p"))}</dd>
        <dt>${u.fail}</dt><dd>${fmt(X(it, "f"))}</dd>
        <dt>${u.fix}</dt><dd>${fmt(X(it, "x"))}</dd>
        <dt>${u.src}</dt><dd class="src">${fmt(it.src)}</dd>
      </dl>
    </div></div>`;
}
function renderAgent() {
  const u = U();
  const vclass = v => v === "pass" ? "pass" : v === "fail" ? "fail" : "na";
  let h = `<h1>${u.titleA}</h1><p class="sub">${u.subA}</p>
  <section class="card">
    <div class="sec-head"><h2>${u.howTitle}</h2></div>
    <div class="flow">${u.steps.map((s, i) =>
      `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<div class="step" title="${esc(u.stepText[i].replace(/`/g, ""))}"><span class="n">${i + 1}</span><span class="l">${esc(s)}</span></div>`).join("")}</div>
    <div class="cols">
      <div><h3>${u.stepsTitle}</h3><ol class="steps">${u.stepText.map(t => `<li>${fmt(t)}</li>`).join("")}</ol></div>
      <div><h3>${u.rulesTitle}</h3><ul class="rules">${u.rules.map(t => `<li>${fmt(t)}</li>`).join("")}</ul></div>
    </div>
  </section>
  <section class="card">
    <div class="sec-head"><h2>${u.outTitle}</h2><span class="sec-meta">${esc(u.outNote)}</span></div>
    <div class="tbl"><table class="out"><thead><tr>${u.outCols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${u.outRows.map(r => `<tr><td><code>${r[0]}</code></td><td class="v ${vclass(r[1])}">${r[1]}</td><td>${fmt(r[2])}</td><td>${fmt(r[3])}</td></tr>`).join("")}</tbody></table></div>
    <h3>${u.reviewerTitle}</h3>
    <ul class="reviewer">${u.reviewerRows.map(r => `<li><code>${r[0]}</code> <strong>${esc(r[1])}</strong> · ${fmt(r[2])}</li>`).join("")}</ul>
  </section>
  <div class="actions">
    <button type="button" class="btn" data-act="all" aria-pressed="${st.all}">${st.all ? u.collapseAll : u.expandAll}</button>
    <button type="button" class="btn" data-act="blockers" aria-pressed="${st.blockersOnly}">${u.blockersOnly}</button>
    <button type="button" class="btn" data-act="md" aria-pressed="${st.md}">${st.md ? u.hideMd : u.showMd}</button>
  </div>`;
  if (st.md) h += `<pre class="md">${esc(mdAgent())}</pre>`;
  let layer = null;
  for (const s of SECTIONS) {
    let list = inSec(s.id);
    if (st.blockersOnly) list = list.filter(i => i.sev === "blocker");
    if (!list.length) continue;
    if (layerOf(s) !== layer) { layer = layerOf(s); h += `<h2 class="layer">${esc(u.layers[layer])}</h2>`; }
    h += `<section class="card">
      <div class="sec-head"><h2>${s.id} · ${esc(s[st.lang].name)}<span class="chip">${s.ref}</span></h2><span class="sec-meta">${secMeta(inSec(s.id))}</span></div>
      ${s[st.lang].note ? `<p class="sec-note">${fmt(s[st.lang].note)}</p>` : ""}
      <div class="accs">${list.map(accItem).join("")}</div></section>`;
  }
  h += `<footer>${esc(u.footer)}</footer>`;
  return h;
}

/* ---------- Markdown output (what the generated .md files look like) ---------- */
function mdHuman() {
  const u = U(), out = [];
  const group = k => {
    const L = k[st.lang];
    out.push(`### ${k.id} · ${L.t}`, "");
    if (L.w) out.push(`${u.whyLabel} ${L.w}`, "");
    k.checks.forEach(c => out.push(`- [ ] **${c.id}** ${c[st.lang]}${c.refs.length ? ` (${c.refs.join(", ")})` : ""}`));
    out.push("");
  };
  out.push(`# ${u.titleH}`, "", u.subH, "");
  MAIN_KEYS.forEach(group);
  return out.join("\n");
}
function mdAgent() {
  const u = U(); const out = [];
  out.push(`# ${u.titleA}`, "", u.subA, "", `## ${u.howTitle}`, "");
  u.steps.forEach((s, i) => out.push(`${i + 1}. **${s}.** ${u.stepText[i]}`));
  out.push("", `## ${u.rulesTitle}`, "");
  u.rules.forEach(r => out.push(`- ${r}`));
  out.push("", `## ${u.outTitle}`, "", `| ${u.outCols.join(" | ")} |`, `| ${u.outCols.map(() => ":---").join(" | ")} |`);
  u.outRows.forEach(r => out.push(`| ${r.join(" | ")} |`));
  out.push("", `### ${u.reviewerTitle}`, "");
  u.reviewerRows.forEach(r => out.push(`- **${r[0]} · ${r[1]}** ${r[2]}`));
  let layer = null;
  for (const s of SECTIONS) {
    if (layerOf(s) !== layer) { layer = layerOf(s); out.push("", `## ${u.layers[layer]}`); }
    out.push("", `### ${s.id} · ${s[st.lang].name}`);
    if (s[st.lang].note) out.push("", s[st.lang].note);
    for (const it of inSec(s.id)) {
      out.push("", `#### ${it.id} · ${X(it, "t")}  [${it.sev} · ${it.ref}]`,
        `${u.humanLine}: ${X(it, "h")}`,
        `${u.applies}: ${appliesOf(it)}`,
        `${u.look}: ${X(it, "l")}`,
        `${u.pass}: ${X(it, "p")}`,
        `${u.fail}: ${X(it, "f")}`,
        `${u.fix}: ${X(it, "x")}`,
        `${u.src}: ${it.src}`);
    }
  }
  return out.join("\n");
}

/* ---------- render + events ---------- */
function render() {
  const u = U();
  document.documentElement.lang = st.lang === "zh" ? "zh-Hans" : "en";
  document.title = (st.view === "human" ? u.titleH : u.titleA) + " · preview";
  document.getElementById("brand").textContent = u.brand;
  document.querySelectorAll("[data-view]").forEach(b => {
    b.textContent = u[b.dataset.view];
    b.setAttribute("aria-pressed", String(b.dataset.view === st.view));
  });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === st.lang)));
  document.getElementById("app").innerHTML = st.view === "human" ? renderHuman() : renderAgent();
}

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) { st.view = v.dataset.view; st.md = false; writeHash(); render(); return; }
  const l = e.target.closest("[data-lang]");
  if (l) { st.lang = l.dataset.lang; writeHash(); render(); return; }
  const a = e.target.closest("[data-acc]");
  if (a) {
    const id = a.dataset.acc;
    if (st.all) { st.all = false; st.open = id; }
    else st.open = st.open === id ? null : id;
    render();
    const el = document.getElementById("acc-" + id);
    if (el && el.getBoundingClientRect().top < 60) el.scrollIntoView({ block: "start" });
    return;
  }
  const b = e.target.closest("[data-act]");
  if (b) {
    const act = b.dataset.act;
    if (act === "md") st.md = !st.md;
    if (act === "clear") { st.checks = {}; save(); }
    if (act === "all") { st.all = !st.all; st.open = null; }
    if (act === "blockers") st.blockersOnly = !st.blockersOnly;
    render();
  }
});
document.addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox][data-id]");
  if (!cb) return;
  if (cb.checked) st.checks[cb.dataset.id] = true; else delete st.checks[cb.dataset.id];
  save();
  const row = document.getElementById("row-" + cb.dataset.id);
  if (row) row.classList.toggle("done", cb.checked);
  updateCounts();
});
window.addEventListener("hashchange", () => { readHash(); render(); });

readHash();
render();
</script>
</body>
