name: Proposal review event

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, secrets, artifacts or PR-controlled input. The trusted
      # workflow_run consumer re-reads authoritative PR data from GitHub.
      - name: Signal a review update
        run: echo 'Review changed; the proposal index will refresh from GitHub.'
