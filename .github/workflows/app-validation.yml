name: App runtime validation
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'examples/**'
      - 'apps/**'
      - 'package*.json'
      - '.github/workflows/app-validation.yml'
  push:
    branches: [main, draft/app-contribution-examples]
    paths:
      - 'runtime/**'
      - 'examples/**'
      - 'apps/**'
      - 'package*.json'
      - '.github/workflows/app-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reproduce from a fresh public checkout
        run: npm test
      - name: Validate submitted App packages
        run: node runtime/ci/verify-submissions.cjs . .artifacts/submissions
      - name: Save results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-runtime-node-${{ matrix.node }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
  base-runtime-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: trusted-base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check with the base revision's validator
        shell: bash
        run: |
          mkdir -p evidence
          if [ -f trusted-base/runtime/ci/verify-submissions.cjs ]; then
            node trusted-base/runtime/ci/verify-submissions.cjs candidate evidence
          else
            echo 'Base runtime not available: bootstrap PR needs maintainer review; this is not a compatibility pass.' | tee evidence/NOT-RUN.txt
            echo 'Base-runtime compatibility: NOT RUN (runtime bootstrap).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save independent compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-runtime-compatibility
          path: evidence/
